<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Left Cyan Leg Gradient -->
    <linearGradient id="cyan-leg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#23a8d6" />
      <stop offset="100%" stop-color="#69e4eb" />
    </linearGradient>

    <!-- Left Blue Leg Gradient -->
    <linearGradient id="blue-leg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2980e1" />
      <stop offset="100%" stop-color="#3858e3" />
    </linearGradient>

    <!-- Right Purple Leg Gradient -->
    <linearGradient id="purple-leg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#23a8d6" />
      <stop offset="100%" stop-color="#9329e7" />
    </linearGradient>
    
    <!-- Wave Gradient -->
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a76e2" />
      <stop offset="100%" stop-color="#9329e7" />
    </linearGradient>

    <!-- Orbital Ring Gradient -->
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#69e4eb" />
      <stop offset="100%" stop-color="#9329e7" />
    </linearGradient>

    <!-- Depth Shadow for 3D overlap effect -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-15" dy="15" stdDeviation="15" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Clear Background (Transparent) -->
  <rect width="1024" height="1024" fill="transparent" />

  <!-- LEFT LEG -->
  <!-- Cyan part -->
  <polygon points="400,150 460,150 160,850 100,850" fill="url(#cyan-leg)" />
  <!-- Blue part -->
  <polygon points="460,150 520,150 220,850 160,850" fill="url(#blue-leg)" />

  <!-- WAVE CROSSBAR -->
  <!-- Swoops from the left leg, under the right leg -->
  <path d="M 160 700 C 350 450, 600 450, 780 600 C 600 680, 450 680, 220 820 Z" fill="url(#wave)" filter="url(#shadow)" />

  <!-- ORBITAL RING -->
  <!-- Crosses over the left leg, slides under the right leg -->
  <ellipse cx="490" cy="550" rx="440" ry="85" fill="none" stroke="url(#ring)" stroke-width="16" transform="rotate(-15 490 550)" />

  <!-- RIGHT LEG -->
  <!-- Purple part. Overlaps the left leg at the apex, covers the ring on the right edge. -->
  <polygon points="460,150 580,150 880,850 760,850" fill="url(#purple-leg)" filter="url(#shadow)" />

  <!-- STAR / SPARKLE -->
  <path d="M 850 200 Q 850 250 800 250 Q 850 250 850 300 Q 850 250 900 250 Q 850 250 850 200 Z" fill="#23a8d6" />
</svg>
